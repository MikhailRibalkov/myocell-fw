[package]
name = "receiver"
version = "0.1.0"
edition = "2024"

[dependencies]
ads1298 = { version = "0.1.0", path = "../ads1298" }
axum = { version = "0.8.9", features = ["ws"] }
protocol = { version = "0.1.0", path = "../protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync"] }
